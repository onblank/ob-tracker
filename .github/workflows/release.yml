name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose native assets should be rebuilt
        required: true
        type: string
      source_ref:
        description: Source ref to build; leave empty to build the release tag
        required: false
        default: ''
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: app-token
        name: Create release automation token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.ONBLANK_RELEASE_APP_ID }}
          private-key: ${{ secrets.ONBLANK_RELEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  native-builds:
    needs: release-please
    if: >-
      ${{
        always() &&
        ((github.event_name == 'push' &&
          needs.release-please.result == 'success' &&
          needs.release-please.outputs.release_created == 'true') ||
         (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: package:win
          - os: macos-latest
            command: package:mac
          - os: ubuntu-latest
            command: package:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.source_ref || inputs.release_tag) || needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate recovery source version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          actual_version="$(node -p "require('./package.json').version")"
          if [ "$actual_version" != "$expected_version" ]; then
            echo "Source version $actual_version does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@12.4.1 --activate
      - name: Install
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
      - name: Build installer
        run: pnpm ${{ matrix.command }}
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ runner.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  publish-assets:
    needs: [release-please, native-builds]
    if: >-
      ${{
        always() &&
        needs.native-builds.result == 'success' &&
        ((github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
         (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect release assets and create checksums
        run: |
          mkdir release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > ../SHA256SUMS
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" release-assets/* SHA256SUMS --clobber
