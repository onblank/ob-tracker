appId: com.onblanksystems.obtracker
productName: OB-Tracker
copyright: Copyright © onBlank Systems
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
files:
  - dist/**
  - package.json
extraResources:
  - from: ../../packages/db-sqlite/migrations
    to: migrations
    filter:
      - '*.sql'
  - from: build/tray-icon.png
    to: tray-icon.png
directories:
  output: release
  buildResources: build
artifactName: 'OB-Tracker-${version}-${os}-${arch}.${ext}'
publish: null
fileAssociations:
  - ext: obtracker
    name: OB-Tracker Data Export
    description: OB-Tracker portable data export
    role: Editor
    mimeType: application/x-obtracker
win:
  icon: build/icon.ico
  executableName: OB-Tracker
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  icon: build/icon.icns
  executableName: OB-Tracker
  target:
    - target: dmg
      arch:
        - universal
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  x64ArchFiles: Contents/Resources/app.asar.unpacked/**/*.node
linux:
  icon: build/icon.png
  executableName: ob-tracker
  maintainer: onBlank Systems
  syncDesktopName: true
  category: Office
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
